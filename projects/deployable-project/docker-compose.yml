services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sepsisnet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sepsisnet_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./services/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SEPSISNET_DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-sepsisnet_dev}@db:5432/sepsisnet
      SEPSISNET_MODEL_CONFIG_PATH: /app/models/tier2_supermodel_v1.json
      SEPSISNET_SCORING_THRESHOLD: youden
      SEPSISNET_SCORING_MIN_HOURS: "6"
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro

volumes:
  pgdata:
